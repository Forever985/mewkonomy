name: Market History Sampling

# 定时抓取官方市场快照，追加到 data/market_history_<UTC日>T<HH>.json 分片
# （UTC 6 小时一块，滚动保留 7 天 / 168 个整点）。
#
# 为什么独立成一条 workflow：
#   原先历史采样和「游戏数据抓取」绑在同一个 job 里，只要 data.json 的上游源挂掉，
#   历史采样就一起停摆。（实测线上因此连续 8 天没有任何新采样点。）
#   本 workflow 只依赖官方 marketplace.json —— 端点约 0.4s 响应、极稳定 ——
#   与游戏数据抓取彻底解耦。
#
# 频率：为什么同时保留 cron 和 workflow_dispatch
#   官方 marketplace.json 的顶层 timestamp 是**市场快照自身的生成时间**，实测它是
#   **整点、每小时**才前进一次，所以「市场历史」的分辨率就是 1 小时。
#   但 GitHub Actions 的 `schedule` 是 best-effort 的：本仓库实测声明 60 分钟一次，
#   实际相邻间隔 143~466 分钟（中位 307），19 次运行全部 success ——
#   是**触发器被延迟**，不是脚本失败。因此每小时这个精度不能只靠 cron。
#
#   → 真正的每小时由**外部定时器按时打 workflow_dispatch** 保证
#     （cron-job.org，配置步骤见 docs/DEVELOPER_GUIDE.md「服务端归档」）。
#   → 下面的 cron 留作兜底：外部触发器哪天挂了，仍能拿到每几小时一个点。
#   两条通道同时命中也不会写重复点：脚本按快照 timestamp 去重，且 concurrency 串行。
#
# 采样脚本自身还有两道护栏：快照 item 数为 0 时放弃本次（绝不用空快照覆盖 7 天历史）；
# 时间戳与线上最后一点相同时跳过写入。分片只动 market_history_*.json，
# 并用 assert_no_unintended_deletions 拒绝任何越权删除。

on:
  schedule:
    # 每小时的第 5 分钟（兜底；主力是外部 workflow_dispatch）
    - cron: "5 * * * *"
  # 外部定时器（cron-job.org）通过 GitHub REST API 触发这里：
  #   POST /repos/{owner}/{repo}/actions/workflows/market-history.yml/dispatches
  #   body: {"ref":"main"}     需要 fine-grained PAT 的 Actions: write 权限
  workflow_dispatch:

# 同一时间只跑一个，避免两次运行同时推送 gh-pages 互相冲突
concurrency:
  group: market-history-sampling
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    # 采样本身只需几秒；给足余量但不占用过多额度
    timeout-minutes: 10
    permissions:
      contents: write # 推送 gh-pages 需要写权限
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch sampler script from main branch
        run: |
          git fetch origin main:main
          git checkout main -- scripts/sample_market_history.py
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade --disable-pip-version-check requests

      - name: Sample and deploy
        run: python scripts/sample_market_history.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
