name: Update Game Data

# 每小时归档一个市场历史采样点，供前端「涨跌」计算使用
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# 同一时间只跑一个，避免两次运行同时推送 gh-pages 互相冲突
concurrency:
  group: update-game-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # 推送 gh-pages 分支需要写权限
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      # 1. 检出 gh-pages 分支（线上数据所在分支，脚本读取其中 data/ 做增量比对）
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages # 强制检出 gh-pages 分支
          fetch-depth: 0 # 需要能取到 main 的提交来拿脚本
          # 用内置 token（下面 permissions: contents: write 已授权），
          # 不再依赖自定义 secret，避免 secret 缺失/过期导致必然失败
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 从 main 分支获取 fetch_game_data.py 脚本（脚本只在 main 上维护）
      - name: Fetch script from main branch
        run: |
          git fetch origin main:main  # 将远程 main 分支拉取到本地 main 分支
          git checkout main -- scripts/fetch_game_data.py  # 从 main 分支提取脚本
        shell: bash

      # 3. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. 安装依赖（ghp-import 已不再使用）
      - name: Install dependencies
        run: python -m pip install --upgrade --disable-pip-version-check requests

      # 5. 抓取并部署
      - name: Fetch and deploy data
        run: python scripts/fetch_game_data.py
        env:
          # 内置 GITHUB_TOKEN：配合上面的 contents: write 即可 clone/push gh-pages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
