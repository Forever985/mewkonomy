name: Update Game Data

# 每天抓一次上游游戏数据（data.json / market.json），有变化才推 gh-pages。
#
# 频率说明：游戏数据只在游戏版本更新时变化，原本每小时跑一次纯属浪费配额。
# 市场历史采样已拆到独立的高频 workflow（market-history.yml），不在本文件里。
#
# 安全护栏：scripts/fetch_game_data.py 里加了「禁止降级」判断——
# 抓到 `versionTimestamp` 比线上已部署更旧的数据时直接拒绝写入，
# 避免上游源停留在旧版本时反向覆盖线上新数据。

on:
  schedule:
    # 每天 UTC 00:20（避开整点的调度高峰）
    - cron: "20 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-game-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # 推送 gh-pages 分支需要写权限
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      # 1. 检出 gh-pages 分支（线上数据所在分支，脚本读取其中 data/ 做增量比对）
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          # 用内置 token（下面 permissions: contents: write 已授权），
          # 不再依赖自定义 secret，避免 secret 缺失/过期导致必然失败
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 从 main 分支获取脚本（脚本只在 main 上维护）
      - name: Fetch scripts from main branch
        run: |
          git fetch origin main:main  # 将远程 main 分支拉取到本地 main 分支
          git checkout main -- scripts/fetch_game_data.py
        shell: bash

      # 3. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. 安装依赖
      - name: Install dependencies
        run: python -m pip install --upgrade --disable-pip-version-check requests

      # 5. 抓取并部署
      - name: Fetch and deploy data
        run: python scripts/fetch_game_data.py
        env:
          # 内置 GITHUB_TOKEN：配合上面的 contents: write 即可 clone/push gh-pages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
