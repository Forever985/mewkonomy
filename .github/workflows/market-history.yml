name: Market History Sampling

# 定时抓取官方市场快照，追加到 data/market_history.json（滚动 7 天）。
#
# 为什么独立成一条 workflow：
#   原先历史采样和「游戏数据抓取」绑在同一个 job 里，只要 data.json 的上游源挂掉，
#   历史采样就一起停摆。（实测线上因此连续 8 天没有任何新采样点。）
#   本 workflow 只依赖官方 marketplace.json —— 端点约 0.4s 响应、极稳定 ——
#   与游戏数据抓取彻底解耦。
#
# 频率为什么是「每小时 5 分」而不是「每 20 分钟」（实测结论）：
#   官方 marketplace.json 的顶层 timestamp 是**市场快照自身的生成时间**，实测它是
#   **整点、每小时**才前进一次（连续 18 分钟观察同一个值：08:06:00Z 始终不变）。
#   也就是说「市场历史」本身的分辨率就是 1 小时，跑得再密也不会多出采样点 ——
#   同一快照会被脚本按时间戳去重跳过。
#
#   与此同时，GitHub 对本仓库的定时任务是会明显延迟/拉长的：实测 update-data.yml
#   声明每小时一次时，实际相邻间隔为 111~278 分钟（约 2~4.6 小时）。
#   所以这里刻意「跑得比需要的频繁一点」作为容错：只要在某个整点后落地一次就能
#   拿到该小时的采样点，被延迟或跳过也不至于整天缺数据。分钟数取 5，留出快照刚生成
#   就取、避免边界抖动。
#
# 采样脚本自身还有两道护栏：快照 item 数为 0 时放弃本次（绝不用空快照覆盖 7 天历史）；
# 时间戳与线上最后一点相同时跳过写入。

on:
  schedule:
    # 每小时的第 5 分钟（见上方说明：市场快照本身是 1 小时粒度）
    - cron: "5 * * * *"
  workflow_dispatch:

# 同一时间只跑一个，避免两次运行同时推送 gh-pages 互相冲突
concurrency:
  group: market-history-sampling
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    # 采样本身只需几秒；给足余量但不占用过多额度
    timeout-minutes: 10
    permissions:
      contents: write # 推送 gh-pages 需要写权限
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch sampler script from main branch
        run: |
          git fetch origin main:main
          git checkout main -- scripts/sample_market_history.py
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade --disable-pip-version-check requests

      - name: Sample and deploy
        run: python scripts/sample_market_history.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
